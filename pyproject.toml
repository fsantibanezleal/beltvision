[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "beltvision"
version = "0.7.0"
description = "Reusable computer-vision inspection engine for industrial conveyor belts: CLAHE preprocessing, belt-edge geometry, anomaly, segmentation, granulometry, tracking, plus the staged-pipeline + data-contract + measured live/precompute lane-gate + manifest machinery."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
authors = [{ name = "Felipe Santibanez-Leal" }]
keywords = [
    "computer-vision",
    "conveyor-belt",
    "inspection",
    "anomaly-detection",
    "segmentation",
    "granulometry",
    "tracking",
    "onnx",
    "pipeline",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "Typing :: Typed",
]

# Minimal core: the classical stack the engine imports at module load time. Heavy
# deep-learning engines are optional extras (see [dl]) imported lazily in precompute.
dependencies = [
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
    "scikit-image>=0.22",
    "scipy>=1.12",
]

[project.optional-dependencies]
# CPU RUNTIME level ("web running"): CPU torch + onnxruntime + the light learned models
# that fit the VPS. Installed in the app's CPU .venv (VPS emulation) via `beltvision[dl]`.
# Installs from plain PyPI, so it needs no requirements file (a pyproject extra is enough).
# (The GPU training level is the `gpu` extra below + requirements-precompute-gpu.txt, which
#  carries the --extra-index-url for the CUDA torch build that an extra cannot express.)
dl = [
    "torch>=2.3",
    "torchvision>=0.18",
    "onnx>=1.16",
    "onnxruntime>=1.18",
    "ultralytics>=8.2",
    "anomalib>=1.1",
    "transformers>=4.41",
    "timm>=1.0",
    "einops>=0.8",
    "safetensors>=0.4",
    "huggingface-hub>=0.23",
    "boxmot>=16.0",
    "deep-sort-realtime>=1.3",
    "faiss-cpu>=1.8",
    "scikit-learn>=1.4",
    "httpx>=0.27",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]
# GPU TRAINING / PRECOMPUTE level (NOT the CPU VPS runtime): all the heavy models + the
# offline catalogue precompute, run locally with device='cuda'. This extra is the SINGLE
# source for the heavy GPU deps - there is no separate requirements-*.txt file.
# The CUDA build of torch is the only thing an extra cannot pin (it needs a package index),
# so pass that index once at install time, e.g. into a GPU venv:
#     pip install -e ".[gpu]" --extra-index-url https://download.pytorch.org/whl/cu124
# (Verified: torch 2.6.0+cu124 on an RTX 5000 Ada, sm_89, driver CUDA 12.8.)
gpu = [
    "torch>=2.4",
    "torchvision>=0.19",
    "onnx>=1.16",
    "onnxruntime-gpu>=1.18",
    "ultralytics>=8.2",
    "transformers>=4.41",
    "timm>=1.0",
    "groundingdino-py>=0.4",
    "segment-anything>=1.0",
    "anomalib>=1.1",
    "faiss-cpu>=1.8",
    "scikit-learn>=1.4",
    "safetensors>=0.4",
    "huggingface-hub>=0.23",
    "einops>=0.8",
    "httpx>=0.27",
    # temporal/dynamic sequence-video engine: read source video + encode annotated mp4
    # (imageio-ffmpeg bundles a static ffmpeg - no system install, no network at encode time)
    "imageio>=2.34",
    "imageio-ffmpeg>=0.5",
]

[project.scripts]
beltvision = "beltvision.pipeline:main"

[project.urls]
Homepage = "https://github.com/fsantibanezleal/beltvision"
Repository = "https://github.com/fsantibanezleal/beltvision"
Changelog = "https://github.com/fsantibanezleal/beltvision/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["."]
include = ["beltvision*"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "A", "N"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["beltvision"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
