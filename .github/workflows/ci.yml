name: ci
# Lint + import smoke + tests + a CLI pipeline smoke run for the beltvision engine.
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the package with dev extras
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check beltvision tests

      - name: Import smoke
        run: |
          python -c "import beltvision, beltvision.pipeline, beltvision.io.contract, beltvision.core.gate, beltvision.core.manifest; print(beltvision.__version__)"

      - name: Pytest
        run: pytest -q

      - name: Pipeline smoke (one case, all six stages)
        run: |
          set -euo pipefail
          beltvision synth_tear_gt --quick --out "$RUNNER_TEMP/derived"
          test -f "$RUNNER_TEMP/derived/manifests/synth_tear_gt.json"
